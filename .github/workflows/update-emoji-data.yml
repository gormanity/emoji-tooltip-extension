name: Update Emoji Data

on:
  schedule:
    # Run monthly on the 1st at 00:00 UTC
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-emoji-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Read current version
        id: current
        run: |
          version=$(jq -r '.version // "unknown"' src/emoji-data.json)
          count=$(jq -r '.emojis // . | keys | length' src/emoji-data.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Generate emoji data
        run: node scripts/generate-emoji-data.mjs

      - name: Read new version
        id: new
        run: |
          version=$(jq -r '.version' src/emoji-data.json)
          count=$(jq -r '.emojis | keys | length' src/emoji-data.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet src/emoji-data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update-emoji-data
          commit-message: "chore: update emoji data to Emoji ${{ steps.new.outputs.version }}"
          title: "chore: update emoji data to Emoji ${{ steps.new.outputs.version }}"
          body: |
            Automated update of `src/emoji-data.json` from Unicode emoji-test.txt.

            | | Version | Emoji count |
            |---|---|---|
            | Current | ${{ steps.current.outputs.version }} | ${{ steps.current.outputs.count }} |
            | New | ${{ steps.new.outputs.version }} | ${{ steps.new.outputs.count }} |

            Please review the diff to confirm the new emojis look correct.
